<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<title>Kalender</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #37352f;
    --text-muted: #9b9a97;
    --border: #ebebea;
    --hover: #f2f1ee;
    --today-bg: #eb5757;
    --today-text: #ffffff;
    --popover-bg: #ffffff;
    --popover-shadow: rgba(15, 15, 15, 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --text: #e9e9e7;
      --text-muted: #6f6e69;
      --border: #2f2f2f;
      --hover: #232323;
      --today-bg: #eb5757;
      --today-text: #ffffff;
      --popover-bg: #252525;
      --popover-shadow: rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 10px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .month-label { font-size: 13px; font-weight: 600; }
  .nav { display: flex; align-items: center; gap: 2px; }
  .nav button {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1.6;
  }
  .nav button:hover { background: var(--hover); }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 10px;
    color: var(--text-muted);
  }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
  }
  .weekday {
    text-align: center;
    font-size: 9px;
    color: var(--text-muted);
    padding: 3px 0;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .day {
    position: relative;
    min-height: 50px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 3px 4px;
  }
  .day.clickable { cursor: pointer; }
  .day.clickable:hover { background: var(--hover); }
  .day.other-month { opacity: 0.35; }
  .day-num {
    font-size: 10px;
    width: 16px;
    height: 16px;
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .day-num.today { background: var(--today-bg); color: var(--today-text); font-weight: 600; }
  .event-text {
    font-size: 10px;
    padding: 1px 4px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 3px;
    line-height: 1.5;
  }
  .dots { display: flex; align-items: center; gap: 3px; margin-top: 2px; flex-wrap: wrap; }
  .dot-event { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .more-badge { font-size: 8px; color: var(--text-muted); }
  .empty-state {
    text-align: center;
    padding: 30px 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .empty-state code {
    background: var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
  }
  .loading { text-align: center; padding: 24px; color: var(--text-muted); }
  .popover {
    position: absolute;
    z-index: 1000;
    width: 220px;
    max-width: calc(100vw - 16px);
    background: var(--popover-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px var(--popover-shadow);
    padding: 8px;
    font-size: 11px;
  }
  .popover-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .popover-close {
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px;
  }
  .popover-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .popover-item { display: flex; align-items: flex-start; gap: 6px; }
  .popover-item .dot-event { margin-top: 4px; }
  .popover-title { font-size: 11px; line-height: 1.4; }
  .popover-meta { font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div id="app"></div>

<script>
const COLORS = ["#579DFF", "#4FC1A6", "#E0975C", "#C77DBD", "#F2994A", "#9B9A97"];
const DAY_NAMES = ["Man", "Tir", "Ons", "Tor", "Fre", "Lør", "Søn"];
const MONTH_NAMES = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
const MAX_DOTS = 4;

const params = new URLSearchParams(window.location.search);
const calendars = [];
for (let i = 1; i <= 6; i++) {
  const url = params.get("cal" + i);
  if (url) {
    calendars.push({ url: url, name: params.get("name" + i) || ("Kalender " + i) });
  }
}

let viewDate = new Date();
viewDate.setDate(1);
let eventsByDayMap = {};

function pad(n) { return String(n).padStart(2, "0"); }
function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

function gridRange(monthDate) {
  const first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday = 0
  const gridStart = new Date(first);
  gridStart.setDate(first.getDate() - startOffset);
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridStart.getDate() + 42);
  return { gridStart, gridEnd };
}

function renderEmptyState() {
  document.getElementById("app").innerHTML =
    '<div class="empty-state">Ingen kalendere lagt til ennå.<br><br>' +
    'Legg til <code>?cal1=https://...ics&name1=Mitt+navn</code> i URL-en (opptil 6 kalendere, cal1–cal6).</div>';
}

function renderLoading() {
  document.getElementById("app").innerHTML = '<div class="loading">Laster inn hendelser …</div>';
}

async function fetchEvents(gridStart, gridEnd) {
  const url = new URL("https://open-web-calendar.hosted.quelltext.eu/calendar.events.json");
  calendars.forEach(c => url.searchParams.append("url", c.url));
  url.searchParams.set("timezone", Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Oslo");
  url.searchParams.set("from", isoDate(gridStart));
  url.searchParams.set("to", isoDate(gridEnd));
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error("network");
  const data = await res.json();
  return data.filter(e => e.type !== "error");
}

function parseLocalDate(str) {
  // "YYYY-MM-DD" parses as UTC by default in JS, which can shift a day
  // in some timezones. Parse date-only strings as local dates instead.
  const m = String(str).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return new Date(str);
}

function isAllDayEvent(e) {
  return !String(e.start_date_iso || e.start_date).includes("T");
}

function formatTime(e) {
  if (isAllDayEvent(e)) return "Hele dagen";
  const fmt = d => d.toLocaleTimeString("no-NO", { hour: "2-digit", minute: "2-digit" });
  const start = new Date(e.start_date_iso || e.start_date);
  const end = e.end_date_iso ? new Date(e.end_date_iso) : null;
  return end ? fmt(start) + "–" + fmt(end) : fmt(start);
}

function eventsByDay(events, gridStart, gridEnd) {
  const map = {};
  for (const e of events) {
    const startStr = e.start_date_iso || e.start_date;
    const endStr = e.end_date_iso || e.end_date || startStr;
    const isAllDay = isAllDayEvent(e);
    const start = parseLocalDate(startStr);
    let end = parseLocalDate(endStr);
    if (isAllDay) {
      // All-day events report an exclusive end date; step back one day
      // so a single-day event doesn't spill onto the next day.
      end = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 1);
    }
    let cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const last = new Date(end.getFullYear(), end.getMonth(), end.getDate());
    if (last < cursor) continue;
    while (cursor <= last && cursor < gridEnd) {
      if (cursor >= gridStart) {
        const key = isoDate(cursor);
        (map[key] = map[key] || []).push(e);
      }
      cursor.setDate(cursor.getDate() + 1);
    }
  }
  return map;
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function closePopover() {
  const p = document.getElementById("day-popover");
  if (p) p.remove();
  document.removeEventListener("click", outsideClick, true);
}

function outsideClick(ev) {
  const p = document.getElementById("day-popover");
  if (p && !p.contains(ev.target)) closePopover();
}

function showPopover(dateKey, dayEvents, anchorEl) {
  closePopover();
  const d = parseLocalDate(dateKey);
  const pop = document.createElement("div");
  pop.className = "popover";
  pop.id = "day-popover";

  let inner = '<div class="popover-header"><span>' + d.getDate() + '. ' + MONTH_NAMES[d.getMonth()] + '</span>' +
    '<button class="popover-close" id="popover-close" aria-label="Lukk">×</button></div>';
  inner += '<div class="popover-list">';
  dayEvents.forEach(e => {
    const color = COLORS[(e["calendar-index"] || 0) % COLORS.length];
    const loc = e.location && e.location.text ? " · " + escapeHtml(e.location.text) : "";
    inner += '<div class="popover-item"><span class="dot-event" style="background:' + color + '"></span>' +
      '<div><div class="popover-title">' + escapeHtml(e.text || "") + '</div>' +
      '<div class="popover-meta">' + formatTime(e) + loc + '</div></div></div>';
  });
  inner += '</div>';
  pop.innerHTML = inner;
  document.body.appendChild(pop);

  const rect = anchorEl.getBoundingClientRect();
  const popWidth = 220;
  let left = rect.left + window.scrollX;
  if (left + popWidth > window.innerWidth) left = window.innerWidth - popWidth - 8;
  pop.style.left = Math.max(8, left) + "px";
  pop.style.top = (rect.bottom + window.scrollY + 4) + "px";

  document.getElementById("popover-close").onclick = closePopover;
  setTimeout(() => document.addEventListener("click", outsideClick, true), 0);
}

async function render() {
  if (calendars.length === 0) { renderEmptyState(); return; }
  renderLoading();
  const { gridStart, gridEnd } = gridRange(viewDate);
  let events = [];
  try {
    events = await fetchEvents(gridStart, gridEnd);
  } catch (err) {
    document.getElementById("app").innerHTML = '<div class="empty-state">Kunne ikke hente hendelser akkurat nå. Prøv å laste siden på nytt.</div>';
    return;
  }
  eventsByDayMap = eventsByDay(events, gridStart, gridEnd);
  const today = new Date();

  let html = '';
  html += '<div class="header"><div class="month-label">' + MONTH_NAMES[viewDate.getMonth()] + ' ' + viewDate.getFullYear() + '</div>';
  html += '<div class="nav"><button id="prev">‹</button><button id="today-btn">I dag</button><button id="next">›</button></div></div>';

  html += '<div class="legend">';
  calendars.forEach((c, i) => {
    html += '<span><span class="dot" style="background:' + COLORS[i % COLORS.length] + '"></span>' + escapeHtml(c.name) + '</span>';
  });
  html += '</div>';

  html += '<div class="grid">';
  DAY_NAMES.forEach(d => html += '<div class="weekday">' + d + '</div>');

  const cursor = new Date(gridStart);
  for (let i = 0; i < 42; i++) {
    const inMonth = cursor.getMonth() === viewDate.getMonth();
    const key = isoDate(cursor);
    const dayEvents = eventsByDayMap[key] || [];
    const hasEvents = dayEvents.length > 0;
    const first = dayEvents[0];
    const rest = dayEvents.slice(1, 1 + MAX_DOTS);
    const overflow = dayEvents.length - 1 - rest.length;

    html += '<div class="day' + (inMonth ? '' : ' other-month') + (hasEvents ? ' clickable' : '') + '" data-date="' + key + '">';
    html += '<div class="day-num' + (sameDay(cursor, today) ? ' today' : '') + '">' + cursor.getDate() + '</div>';
    if (first) {
      const firstColor = COLORS[(first["calendar-index"] || 0) % COLORS.length];
      html += '<div class="event-text" style="background:' + firstColor + '22;color:' + firstColor + '">' + escapeHtml(first.text || '') + '</div>';
    }
    if (rest.length > 0 || overflow > 0) {
      html += '<div class="dots">';
      rest.forEach(e => {
        const color = COLORS[(e["calendar-index"] || 0) % COLORS.length];
        html += '<span class="dot-event" style="background:' + color + '"></span>';
      });
      if (overflow > 0) html += '<span class="more-badge">+' + overflow + '</span>';
      html += '</div>';
    }
    html += '</div>';
    cursor.setDate(cursor.getDate() + 1);
  }
  html += '</div>';

  document.getElementById("app").innerHTML = html;
  document.getElementById("prev").onclick = () => { closePopover(); viewDate.setMonth(viewDate.getMonth() - 1); render(); };
  document.getElementById("next").onclick = () => { closePopover(); viewDate.setMonth(viewDate.getMonth() + 1); render(); };
  document.getElementById("today-btn").onclick = () => { closePopover(); viewDate = new Date(); viewDate.setDate(1); render(); };

  document.querySelectorAll(".day.clickable").forEach(el => {
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const key = el.getAttribute("data-date");
      showPopover(key, eventsByDayMap[key] || [], el);
    });
  });
}

render();
</script>
</body>
</html>
