<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<title>Kalender</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #37352f;
    --text-muted: #9b9a97;
    --border: #ebebea;
    --today-bg: #37352f;
    --today-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --text: #e9e9e7;
      --text-muted: #6f6e69;
      --border: #2f2f2f;
      --today-bg: #e9e9e7;
      --today-text: #191919;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .month-label { font-size: 15px; font-weight: 600; }
  .nav { display: flex; gap: 4px; }
  .nav button {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .nav button:hover { background: var(--border); }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
  }
  .weekday {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    padding: 4px 0;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .day {
    min-height: 64px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .day.other-month { opacity: 0.35; }
  .day-num {
    font-size: 11px;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .day-num.today { background: var(--today-bg); color: var(--today-text); font-weight: 600; }
  .event {
    font-size: 10px;
    padding: 1px 4px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
  }
  .more { font-size: 10px; color: var(--text-muted); padding-left: 4px; }
  .empty-state {
    text-align: center;
    padding: 40px 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .empty-state code {
    background: var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
  }
  .loading { text-align: center; padding: 30px; color: var(--text-muted); }
</style>
</head>
<body>
  <div id="app"></div>

<script>
const COLORS = ["#579DFF", "#4FC1A6", "#E0975C", "#C77DBD"];
const DAY_NAMES = ["Man", "Tir", "Ons", "Tor", "Fre", "Lør", "Søn"];
const MONTH_NAMES = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];

const params = new URLSearchParams(window.location.search);
const calendars = [];
for (let i = 1; i <= 6; i++) {
  const url = params.get("cal" + i);
  if (url) {
    calendars.push({ url: url, name: params.get("name" + i) || ("Kalender " + i) });
  }
}

let viewDate = new Date();
viewDate.setDate(1);

function pad(n) { return String(n).padStart(2, "0"); }
function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

function gridRange(monthDate) {
  const first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday = 0
  const gridStart = new Date(first);
  gridStart.setDate(first.getDate() - startOffset);
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridStart.getDate() + 42);
  return { gridStart, gridEnd };
}

function renderEmptyState() {
  document.getElementById("app").innerHTML =
    '<div class="empty-state">Ingen kalendere lagt til ennå.<br><br>' +
    'Legg til <code>?cal1=https://...ics&name1=Mitt+navn</code> i URL-en (opptil 6 kalendere, cal1–cal6).</div>';
}

function renderLoading() {
  document.getElementById("app").innerHTML = '<div class="loading">Laster inn hendelser …</div>';
}

async function fetchEvents(gridStart, gridEnd) {
  const url = new URL("https://open-web-calendar.hosted.quelltext.eu/calendar.events.json");
  calendars.forEach(c => url.searchParams.append("url", c.url));
  url.searchParams.set("timezone", Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Oslo");
  url.searchParams.set("from", isoDate(gridStart));
  url.searchParams.set("to", isoDate(gridEnd));
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error("network");
  const data = await res.json();
  return data.filter(e => e.type !== "error");
}

function parseLocalDate(str) {
  // "YYYY-MM-DD" parses as UTC by default in JS, which can shift a day
  // in some timezones. Parse date-only strings as local dates instead.
  const m = String(str).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return new Date(str);
}

function eventsByDay(events, gridStart, gridEnd) {
  const map = {};
  for (const e of events) {
    const startStr = e.start_date_iso || e.start_date;
    const endStr = e.end_date_iso || e.end_date || startStr;
    const isAllDay = !String(startStr).includes("T");
    const start = parseLocalDate(startStr);
    let end = parseLocalDate(endStr);
    if (isAllDay) {
      // All-day events report an exclusive end date; step back one day
      // so a single-day event doesn't spill onto the next day.
      end = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 1);
    }
    let cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const last = new Date(end.getFullYear(), end.getMonth(), end.getDate());
    if (last < cursor) continue;
    while (cursor <= last && cursor < gridEnd) {
      if (cursor >= gridStart) {
        const key = isoDate(cursor);
        (map[key] = map[key] || []).push(e);
      }
      cursor.setDate(cursor.getDate() + 1);
    }
  }
  return map;
}

async function render() {
  if (calendars.length === 0) { renderEmptyState(); return; }
  renderLoading();
  const { gridStart, gridEnd } = gridRange(viewDate);
  let events = [];
  try {
    events = await fetchEvents(gridStart, gridEnd);
  } catch (err) {
    document.getElementById("app").innerHTML = '<div class="empty-state">Kunne ikke hente hendelser akkurat nå. Prøv å laste siden på nytt.</div>';
    return;
  }
  const byDay = eventsByDay(events, gridStart, gridEnd);
  const today = new Date();

  let html = '';
  html += '<div class="header"><div class="month-label">' + MONTH_NAMES[viewDate.getMonth()] + ' ' + viewDate.getFullYear() + '</div>';
  html += '<div class="nav"><button id="prev">‹</button><button id="today-btn">I dag</button><button id="next">›</button></div></div>';

  html += '<div class="legend">';
  calendars.forEach((c, i) => {
    html += '<span><span class="dot" style="background:' + COLORS[i % COLORS.length] + '"></span>' + escapeHtml(c.name) + '</span>';
  });
  html += '</div>';

  html += '<div class="grid">';
  DAY_NAMES.forEach(d => html += '<div class="weekday">' + d + '</div>');

  const cursor = new Date(gridStart);
  for (let i = 0; i < 42; i++) {
    const inMonth = cursor.getMonth() === viewDate.getMonth();
    const key = isoDate(cursor);
    const dayEvents = (byDay[key] || []).slice(0, 3);
    const overflow = (byDay[key] || []).length - dayEvents.length;
    html += '<div class="day' + (inMonth ? '' : ' other-month') + '">';
    html += '<div class="day-num' + (sameDay(cursor, today) ? ' today' : '') + '">' + cursor.getDate() + '</div>';
    dayEvents.forEach(e => {
      const color = COLORS[(e["calendar-index"] || 0) % COLORS.length];
      html += '<div class="event" title="' + escapeHtml(e.text || '') + '" style="background:' + color + '22;color:' + color + '">' + escapeHtml(e.text || '') + '</div>';
    });
    if (overflow > 0) html += '<div class="more">+' + overflow + ' til</div>';
    html += '</div>';
    cursor.setDate(cursor.getDate() + 1);
  }
  html += '</div>';

  document.getElementById("app").innerHTML = html;
  document.getElementById("prev").onclick = () => { viewDate.setMonth(viewDate.getMonth() - 1); render(); };
  document.getElementById("next").onclick = () => { viewDate.setMonth(viewDate.getMonth() + 1); render(); };
  document.getElementById("today-btn").onclick = () => { viewDate = new Date(); viewDate.setDate(1); render(); };
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
